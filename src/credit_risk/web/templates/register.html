{% extends "base.html" %}
{% block title %}Create account · Credit Risk Engine{% endblock %}
{% block body %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand"><span class="dot"></span> Credit Risk Engine</div>
    <h1>Create your account</h1>
    <p class="sub">Register your organisation to start scoring applicants.</p>

    {% if error %}<div class="alert error">{{ error }}</div>{% endif %}

    <form method="post" action="/register">
      <label for="company_name">Company name</label>
      <input id="company_name" name="company_name" autocomplete="organization" placeholder="Acme Lending" required autofocus>
      <label for="employer_id">Employer ID</label>
      <input id="employer_id" name="employer_id" autocomplete="username" placeholder="EMP123" required>
      <label for="full_name">Your name</label>
      <input id="full_name" name="full_name" autocomplete="name" placeholder="Alex Carter">
      <label for="email">Work email</label>
      <input id="email" name="email" type="email" autocomplete="email" placeholder="you@company.com">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" placeholder="At least 6 characters" required>
      <div class="btn-row"><button class="btn block" type="submit">Create account</button></div>
    </form>

    <p class="alt">Already registered? <a href="/login">Sign in</a></p>
  </div>
</div>
{% endblock %}
